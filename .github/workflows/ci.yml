name: Library AI System — CI Pipeline C13
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dépendances
        run: |
          if [ -f requirements.txt ]; then 
            # Supprime TOUTES les dépendances Windows (pywin32 et pypiwin32)
            sed -i '/win32/d' requirements.txt
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Initialisation Base SQLite
        run: |
          if [ -f database.py ]; then python database.py; fi

      - name: Validation Pytest
        run: pytest **/test_*.py -v || pytest
